# Overrides on top of the packaged acng.conf (acng reads every *.conf here).
# Tunnel https (CONNECT to port 443, e.g. https repos) instead of refusing it.
# Not ".*", which would make this an open TCP relay to any host and port. The
# target must be a bare host:443: acng drops anything after "?" when it
# connects, so a looser pattern lets "host:22?:443" through to port 22.
PassThroughPattern: ^[A-Za-z0-9.-]+:443$
VerboseLog: 2
