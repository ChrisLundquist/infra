# Expire remote logs 90 days after their last write (mtime, so reading old
# logs doesn't keep them alive). Live files are written constantly; this
# catches rotated archives and hosts that went quiet, then their empty
# directories. _archive holds one-off history to keep (see DEPLOY.md).
d /var/log/remotes 0750 syslog adm mM:90d
x /var/log/remotes/_archive
