# The LAN's syslog sink. Every image forwards *.* to logs.local:514
# (files/etc/rsyslog.d/90-remote.conf); file each message under
# /var/log/remotes/<host>/<program>.log. logrotate.d/remote-logs rotates and
# compresses them, and tmpfiles.d/remote-logs.conf expires them.

module(load="imudp")
module(load="imtcp")

# secpath-replace turns "/" into "_" (and a bare "." or ".." into "_"), so a
# sender can't name a file outside its own directory.
template(name="RemoteFile" type="string"
         string="/var/log/remotes/%HOSTNAME:::secpath-replace%/%PROGRAMNAME:::secpath-replace%.log")

# Like RSYSLOG_FileFormat, but stamped with the time we received the message.
# Hosts that send local time without a zone (deon, nuc2) would otherwise be
# filed hours off and labelled +00:00.
template(name="RemoteLine" type="string"
         string="%TIMEGENERATED:::date-rfc3339% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# Bound only to the network inputs, so this server's own logs stay in the
# stock /var/log/syslog and friends.
ruleset(name="remote") {
    action(type="omfile" dynaFile="RemoteFile" dynaFileCacheSize="500"
           template="RemoteLine"
           fileGroup="adm" fileCreateMode="0640"
           dirGroup="adm" dirCreateMode="0750" createDirs="on"
           asyncWriting="on" flushInterval="1" ioBufferSize="64k")
}

input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")
