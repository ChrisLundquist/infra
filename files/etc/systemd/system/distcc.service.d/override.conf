# The packaged unit passes "--allow $ALLOWEDNETS" once, so only the first
# network is allowed, and "--jobs $JOBS", which breaks distccd's arguments when
# JOBS is empty (meaning distccd's default). Give each network its own --allow
# and only pass --jobs when it's set. ($$ escapes systemd's own expansion.)
[Service]
ExecStart=
ExecStart=/bin/sh -c 'set -- --daemon --no-detach --listen "$$LISTENER" --nice "$$NICE"; for net in $$ALLOWEDNETS; do set -- "$$@" --allow "$$net"; done; if [ -n "$$JOBS" ]; then set -- "$$@" --jobs "$$JOBS"; fi; exec /usr/bin/distccd "$$@"'
