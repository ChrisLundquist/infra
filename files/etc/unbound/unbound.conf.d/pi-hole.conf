# Local resolver for Pi-hole, based on https://docs.pi-hole.net/guides/dns/unbound/
# Pi-hole forwards to 127.0.0.1#5335. In "recursive" mode unbound walks from
# the root itself, so no single upstream sees our whole query stream; Ubuntu's
# root-auto-trust-anchor-file.conf turns on DNSSEC validation.
server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: no
    prefer-ip6: no

    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    num-threads: 1

    # Privacy: send authoritative servers only the labels they need, answer
    # from cached NSEC proofs, and don't identify ourselves.
    qname-minimisation: yes
    aggressive-nsec: yes
    hide-identity: yes
    hide-version: yes

    # Never let public answers point into the LAN (DNS rebinding).
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
