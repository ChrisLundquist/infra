# Only installed when dns_upstream_mode = "dot": forward everything to
# Cloudflare over DNS-over-TLS instead of resolving recursively (the setup
# from the May 2026 resolute commit). Hides queries from the ISP, at the cost
# of Cloudflare seeing all of them.
server:
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
